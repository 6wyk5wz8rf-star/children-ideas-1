<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="The Workshop — five calm creative learning spaces for children aged 7–11.">
  <title>The Workshop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the activity</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Return to The Workshop home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M9 36V17l15-8 15 8v19H9Z"/><path d="M17 36V23h14v13M7 39h34"/></svg>
        </span>
        <span><strong>The Workshop</strong><small>Imagine · investigate · build</small></span>
      </button>
      <nav class="top-actions" aria-label="Workshop controls">
        <button class="icon-button" type="button" data-action="library" aria-label="Open saved work">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h6l2 2h8v11H4z"/><path d="M4 9h16"/></svg>
          <span>Saved</span>
        </button>
        <button class="icon-button" type="button" data-action="help" aria-label="Open help">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 0 1 4.6 1c0 2-2.4 2.2-2.4 4M12 17h.01"/></svg>
          <span>Help</span>
        </button>
        <button class="icon-button" type="button" data-action="settings" aria-label="Open settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.5 1.4 1.1-2 3.4-1.8-.7a8 8 0 0 1-2.2 1.3l-.3 1.9h-4l-.3-1.9a8 8 0 0 1-2.2-1.3l-1.8.7-2-3.4L5 13.5a8 8 0 0 1 0-2.6L3.7 9.8l2-3.4 1.8.7a8 8 0 0 1 2.2-1.3l.3-1.9h4l.3 1.9a8 8 0 0 1 2.2 1.3l1.8-.7 2 3.4-1.4 1.1a8 8 0 0 1 0 2.6Z"/></svg>
          <span>Settings</span>
        </button>
        <button class="icon-button compact-only" type="button" data-action="fullscreen" aria-label="Enter full screen">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg>
        </button>
      </nav>
    </header>

    <main id="main" tabindex="-1"></main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
  </div>
  <noscript><p class="no-script">The Workshop needs JavaScript to create and save work on this device.</p></noscript>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
