<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebe4d7">
  <meta name="description" content="The Workshop — five living creative worlds for children aged 7–11.">
  <title>The Workshop · Build 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the activity</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Return to The Workshop home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M8 38V18l16-9 16 9v20H8Z"/><path d="M16 38V24h16v14M5 41h38"/><circle cx="24" cy="17" r="3"/></svg>
        </span>
        <span><strong data-brand-title>The Workshop</strong><small data-brand-subtitle>Five living places</small></span>
      </button>
      <nav class="top-actions" aria-label="Workshop controls">
        <button class="icon-button" type="button" data-action="undo" data-workspace-only hidden aria-label="Undo">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg><span>Undo</span>
        </button>
        <button class="icon-button" type="button" data-action="redo" data-workspace-only hidden aria-label="Redo">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M19 12h-8a6 6 0 0 0-6 6"/></svg><span>Redo</span>
        </button>
        <button class="icon-button" type="button" data-action="show-output" data-workspace-only hidden aria-label="Share or present">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="m9 21 3-4 3 4"/></svg><span>Share</span>
        </button>
        <button class="icon-button" type="button" data-action="library" aria-label="Open saved work">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg><span>Saved</span>
        </button>
        <button class="icon-button" type="button" data-action="toggle-sound" aria-label="Mute sounds">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 10v4h4l4 4V6L9 10z"/><path data-sound-wave d="M16 9c1 1 1 5 0 6M19 7c3 3 3 7 0 10"/></svg><span data-sound-label>Sound</span>
        </button>
        <button class="icon-button" type="button" data-action="help" aria-label="Show help">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 1c0 2-2.5 2.2-2.5 4M12 17h.01"/></svg><span>Help</span>
        </button>
        <button class="icon-button" type="button" data-action="settings" aria-label="Open settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Settings</span>
        </button>
      </nav>
    </header>

    <main id="main" tabindex="-1"></main>

    <div id="toast-region" class="toast-region" aria-hidden="true"></div>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <div id="print-root"></div>
    <input id="json-import" type="file" accept="application/json,.json" hidden>
  </div>
  <noscript><p class="no-script">The Workshop needs JavaScript to create and save work on this device.</p></noscript>
  <script src="content.js"></script>
  <script src="build2-content.js"></script>
  <script src="visuals.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
